# One public entry point, with automatic HTTPS (Caddy gets and renews a Let's Encrypt
# certificate). Only the page shell and sign-in are public; every other path needs a valid
# token, checked by control-plane (forward_auth) before retrieval-service ever sees it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-door-config
  namespace: namespace-workflow-1790106905740
data:
  Caddyfile: |
    avnish-research.southindia.cloudapp.azure.com {
      # Sign-in, and the Google/GitHub round trip: public, or nobody could ever get a token.
      @signin path /api/v1/auth/* /oauth2/* /login/oauth2/*
      handle @signin {
        reverse_proxy control-plane:8083
      }
      # Runs: control-plane checks the token itself (including the SSE stream's ?token=, which
      # forward_auth would not see). Caddy keeps the browser's Host and sets X-Forwarded-Proto,
      # which control-plane needs to see the request as same-origin. flush_interval -1 streams
      # SSE events at once.
      handle /api/v1/runs* {
        reverse_proxy control-plane:8083 {
          flush_interval -1
        }
      }
      # The page shell and its scripts: public, but they hold no data -- the page shows the
      # login screen until it has a token, and every call it makes needs one.
      @shell path / /index.html /app.js /charts.js /topology.js /vendor/*
      handle @shell {
        reverse_proxy retrieval-service-cicd:8081
      }
      # Everything else -- search, extract, quota, actuator, any path added later -- needs a
      # valid token first. control-plane answers 204 or 401; a 401 goes straight back.
      handle {
        forward_auth control-plane:8083 {
          uri /api/v1/auth/check
        }
        reverse_proxy retrieval-service-cicd:8081
      }
    }
---
# Keeps the certificate across pod restarts; Let's Encrypt limits re-issuing the same name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: front-door-data
  namespace: namespace-workflow-1790106905740
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-door
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: front-door
spec:
  replicas: 1
  # An Azure disk attaches to one pod at a time, so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: front-door
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front-door
      annotations:
        # Bump when the Caddyfile changes so the pod restarts and reloads it.
        config-version: "5"
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "0.05"
              memory: 64Mi
            limits:
              cpu: "0.25"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: front-door-config
        - name: data
          persistentVolumeClaim:
            claimName: front-door-data
---
apiVersion: v1
kind: Service
metadata:
  name: front-door
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: front-door
  annotations:
    # Free Azure hostname: avnish-research.southindia.cloudapp.azure.com, reattached if the IP changes.
    service.beta.kubernetes.io/azure-dns-label-name: avnish-research
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: front-door
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
