# One public entry point, with automatic HTTPS (Caddy gets and renews a Let's Encrypt
# certificate): the console and retrieval APIs go to retrieval-service, /api/v1/runs goes to
# control-plane. Same origin for both, so the browser needs no CORS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-door-config
  namespace: namespace-workflow-1790106905740
data:
  Caddyfile: |
    avnish-research.southindia.cloudapp.azure.com {
      # Runs, plus sign-in: the auth API, the start of a Google/GitHub login (/oauth2/...)
      # and the provider's redirect back (/login/oauth2/code/...).
      @control path /api/v1/runs* /api/v1/auth/* /oauth2/* /login/oauth2/*
      handle @control {
        # Caddy keeps the browser's Host and sets X-Forwarded-Proto, which control-plane
        # needs to see the request as same-origin. flush_interval -1 streams SSE events at once.
        reverse_proxy control-plane:8083 {
          flush_interval -1
        }
      }
      handle {
        reverse_proxy retrieval-service-cicd:8081
      }
    }
---
# Keeps the certificate across pod restarts; Let's Encrypt limits re-issuing the same name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: front-door-data
  namespace: namespace-workflow-1790106905740
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-door
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: front-door
spec:
  replicas: 1
  # An Azure disk attaches to one pod at a time, so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: front-door
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front-door
      annotations:
        # Bump when the Caddyfile changes so the pod restarts and reloads it.
        config-version: "3"
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "0.05"
              memory: 64Mi
            limits:
              cpu: "0.25"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: front-door-config
        - name: data
          persistentVolumeClaim:
            claimName: front-door-data
---
apiVersion: v1
kind: Service
metadata:
  name: front-door
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: front-door
  annotations:
    # Free Azure hostname: avnish-research.southindia.cloudapp.azure.com, reattached if the IP changes.
    service.beta.kubernetes.io/azure-dns-label-name: avnish-research
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: front-door
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
