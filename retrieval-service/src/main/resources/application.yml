source-tiers:
  tier1:
    - pib.gov.in
    - rbi.org.in
    - isro.gov.in
  tier2:
    - thehindu.com
    - indianexpress.com
    - ndtv.com
  tier4-patterns:
    - "*.blogspot.*"
    - "*wordpress.com"
searxng:
  base-url: http://localhost:8080

quota:
  daily-limit: 1000

extractor:
  base-url: http://localhost:8000
  max-document-bytes: 204800
  cache-ttl: 7d
  connect-timeout: 5s
  read-timeout: 10s
  max-concurrent-extractions: 4

rate-limit:
  capacity: 3
  refill-rate: 1
  max-wait-attempts: 3

