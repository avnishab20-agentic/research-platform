source-tiers:
  tier1:
    - pib.gov.in
    - rbi.org.in
    - isro.gov.in
  tier2:
    - thehindu.com
    - indianexpress.com
    - ndtv.com
  tier4-patterns:
    - "*.blogspot.*"
    - "*wordpress.com"
searxng:
  base-url: http://localhost:8080

quota:
  daily-limit: 1000

extractor:
  base-url: http://localhost:8000
  # Raised from 200KB (Session 14 flagged this: "Wikipedia is 1.07MB...
  # TOO_LARGE will be common in practice, not exceptional"). Confirmed live
  # today: every single sub-question across several real questions
  # (population, inflation, financial crisis) lost its top-tier Wikipedia
  # source to this cap, degrading otherwise-answerable questions to
  # PARTIAL. 2MB comfortably covers real encyclopedia/news pages while
  # still rejecting genuinely pathological ones.
  max-document-bytes: 2097152
  cache-ttl: 7d
  connect-timeout: 5s
  read-timeout: 10s
  max-concurrent-extractions: 4

rate-limit:
  capacity: 3
  refill-rate: 1
  max-wait-attempts: 3

