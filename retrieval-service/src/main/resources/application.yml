source-tiers:
  tier1:
    - pib.gov.in
    - rbi.org.in
    - isro.gov.in
  tier2:
    - thehindu.com
    - indianexpress.com
    - ndtv.com
  tier4-patterns:
    - "*.blogspot.*"
    - "*wordpress.com"
searxng:
  base-url: http://localhost:8080

# The one shared guardrails: tree (CLAUDE.md/PLAN's config-tree spec) --
# GuardrailProperties in common/ binds this. Only retrieval.quota-daily-limit
# is actually wired to a real enforcement point so far (QuotaService); the
# rest mirrors PLAN's shape and documents the intended numbers, ready for
# the enforcement points ResearcherService/PlannerService/CriticService
# still need to migrate onto.
guardrails:
  mode: ENFORCE   # ENFORCE | SHADOW -- SHADOW logs a breach and proceeds anyway

  run:
    max-wall-clock: 10m
    max-searches: 40
    max-llm-calls: 60
    max-subquestions: 8
    max-critic-rounds: 2
    on-breach: PARTIAL

  agent:
    researcher:
      max-wall-clock: 90s
      max-tokens: 25000
      max-searches: 5
      on-breach: PARTIAL_LOW_CONFIDENCE

  retrieval:
    quota-daily-limit: 1000
    per-domain-rps: 1
    burst: 3
    extractor-permits: 4
    fetch-parallelism: 5
    connect-timeout: 5s
    read-timeout: 15s
    max-document-bytes: 2097152
    block-private-networks: true

  eval:
    min-catch-rate: 0.85
    max-false-positive-rate: 0.10

extractor:
  base-url: http://localhost:8000
  # Raised from 200KB (Session 14 flagged this: "Wikipedia is 1.07MB...
  # TOO_LARGE will be common in practice, not exceptional"). Confirmed live
  # today: every single sub-question across several real questions
  # (population, inflation, financial crisis) lost its top-tier Wikipedia
  # source to this cap, degrading otherwise-answerable questions to
  # PARTIAL. 2MB comfortably covers real encyclopedia/news pages while
  # still rejecting genuinely pathological ones.
  max-document-bytes: 2097152
  cache-ttl: 7d
  connect-timeout: 5s
  read-timeout: 10s
  max-concurrent-extractions: 4

rate-limit:
  capacity: 3
  refill-rate: 1
  max-wait-attempts: 3

