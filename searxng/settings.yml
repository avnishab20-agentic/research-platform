# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  # Real value comes from the SEARXNG_SECRET env var (set in .env, passed by
  # docker-compose), which overrides this line. Never put the real key here.
  secret_key: "ultrasecretkey"
  image_proxy: true
search:
  formats:
    - html
    - json
