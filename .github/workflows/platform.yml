# Shared cluster config (platform-config ConfigMap) and the public front door.
# A platform-config change only reaches agent-service and control-plane after they restart.
name: platform

on:
  push:
    branches: [main]
    paths:
      - k8s/**
      - .github/workflows/platform.yml
      - .github/workflows/_build-deploy.yml
  # Pull requests run the test stage only; deploy waits for main.
  pull_request:
    paths:
      - k8s/**
      - .github/workflows/platform.yml
      - .github/workflows/_build-deploy.yml
  workflow_dispatch:

# One run at a time per branch, so two deploys to the cluster never overlap.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/_build-deploy.yml
    secrets: inherit
    with:
      # Fails on a YAML typo before anything reaches the cluster.
      test-command: for f in k8s/*.yaml; do yq 'true' "$f" > /dev/null || exit 1; done
      manifests: ./k8s
