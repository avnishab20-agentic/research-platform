name: agent-service

on:
  push:
    branches: [main]
    paths:
      - agent-service/**
      - common/**
      - pom.xml
      - .github/workflows/agent-service.yml
      - .github/workflows/_build-deploy.yml
  # Pull requests run the test stage only; build, deploy and verify wait for main.
  pull_request:
    paths:
      - agent-service/**
      - common/**
      - pom.xml
      - .github/workflows/agent-service.yml
      - .github/workflows/_build-deploy.yml
  workflow_dispatch:

# One run at a time per branch, so two deploys to the cluster never overlap.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/_build-deploy.yml
    secrets: inherit
    with:
      test-setup: java
      test-command: mvn -B -pl agent-service -am test
      image: agent-service
      dockerfile: ./agent-service/Dockerfile
      manifests: ./agent-service/k8s
      deployment: agent-service
      health-port: '8082'
      health-path: /actuator/health
