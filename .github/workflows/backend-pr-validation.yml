# Checks a pull request's backend changes before merge. Never deploys, so it does
# not use _build-deploy.yml.
#
#   maven  -> compile, test and package every module together, so a change in one
#             module (common/ especially) that breaks another is caught here.
#             Then send the code and its test coverage to SonarQube Cloud.
#   docker -> build each service's image without pushing it, to prove the
#             Dockerfile still works. Pull requests only.
#
# It also runs on pushes to main. That run is only there to give SonarQube Cloud
# a baseline, so it can tell which problems a pull request adds.
name: backend-pr-validation

on:
  # Every pull request, with no path filter: the SonarQube Cloud check posted by
  # this workflow is a required check, and a required check that never runs
  # (say, on a docs-only PR) would block the merge forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - pom.xml
      - common/**
      - retrieval-service/**
      - agent-service/**
      - control-plane/**
      - .github/workflows/backend-pr-validation.yml
  workflow_dispatch:

# A new push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    env:
      # Empty until the SONAR_TOKEN repo secret is added (and always empty on pull
      # requests from forks), in which case the scan step below is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Sonar uses it to work out which lines are new in this change.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ControlPlaneApplicationTests boots the whole app, and Flyway needs a live
      # Postgres for that, which the CI runner doesn't have. Every other test runs.
      # verify also writes each module's JaCoCo coverage report.
      - name: Compile, test and package all modules
        run: >-
          mvn -B verify
          -Dtest='!ControlPlaneApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

      # Project key and organization come from the root pom.xml.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  docker:
    needs: maven
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Report every broken image, not just the first one.
      fail-fast: false
      matrix:
        service: [retrieval-service, agent-service, control-plane]
    steps:
      - uses: actions/checkout@v4

      - name: Build the ${{ matrix.service }} image (not pushed)
        run: docker build -t ${{ matrix.service }}:pr-check -f ${{ matrix.service }}/Dockerfile .
