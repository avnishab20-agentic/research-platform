apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: agent-service
spec:
  # No replicas field: KEDA (keda-scaledobject.yaml) owns the pod count. A fixed number here
  # would reset it to that number on every deploy.
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      containers:
        - name: agent-service
          image: researchplatformacr.azurecr.io/agent-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: RETRIEVAL_BASEURL
              value: http://retrieval-service-cicd:8081
            # The JVM defaults to a 25% heap; the embedding model needs more headroom.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
            # On Java 21 a Kafka client blocking under a lock pins its virtual thread's carrier,
            # and a 1-CPU pod has one carrier, so one stuck Kafka call froze the whole app.
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "0.25"
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          # Up to 3 minutes: JVM start plus downloading the embedding model on first boot.
          startupProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 5
            failureThreshold: 36
