spring:
  application:
    name: agent-service
  profiles:
    # CLAUDE.md: "Agent types are Spring profiles of agent-service, not
    # separate deployables." All three active together here because this
    # project runs one agent-service JVM locally (no Kubernetes yet -- Week
    # 5). In production each pod would set SPRING_PROFILES_ACTIVE to just
    # one role, scaled independently by KEDA; this default is only the
    # local-dev shape. Override with an env var, never edit this for a
    # single-role run.
    active: RESEARCHER,WRITER,CRITIC
  datasource:
    url: jdbc:postgresql://localhost:5432/research
    username: research
    password: research
  ai:
    model:
      # Spring AI's multi-provider selector: only activate the openai chat
      # autoconfig and the transformers embedding autoconfig. Without this,
      # having both spring-ai-starter-model-openai and -transformers on the
      # classpath registers two EmbeddingModel beans (openAiEmbeddingModel +
      # embeddingModel) and Spring can't pick -- this is the real fix, not
      # a per-provider enabled flag.
      chat: openai
      embedding: transformers
    openai:
      # DeepSeek's API is OpenAI-compatible -- this is the OpenAI starter
      # pointed at a different host, not a DeepSeek-specific integration.
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          # deepseek-flash serves DeepSeek-V4.1-Flash as of 2026-09-10 --
          # cheaper and faster than GLM 5.3 Flash for this project's needs
          # (text-only; no video input required). If DeepSeek renames this
          # slug again, this is the one line that needs to change.
          model: deepseek-flash
    vectorstore:
      pgvector:
        # Flyway (control-plane's V2 migration) owns this table, not Spring AI's
        # own schema init -- matches "Flyway migration first... never ddl-auto".
        initialize-schema: false
        dimensions: 384
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: agent-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # One record per poll: a researcher subtask can run up to 90s, so pulling
      # a batch would starve every other subtask on the same partition until
      # the whole batch finishes.
      max-poll-records: 1
      properties:
        # Default is 5 min. Research subtasks exceed it, the consumer gets
        # evicted mid-work, and work silently duplicates with no error -- see
        # CLAUDE.md "Traps that have already cost time".
        max.poll.interval.ms: 600000
        # JsonDeserializer refuses to instantiate a class outside this list --
        # a safety check against deserializing arbitrary classes from a topic
        # an attacker could write to. common is the only package these
        # messages ever come from.
        spring.json.trusted.packages: com.comeback.researchplatform.common
        # Week 3: agent-service now consumes two different message types
        # (ResearchSubtask on research.subtasks, RunReady on run.ready), so a
        # single default.type no longer works -- it doesn't vary per topic.
        # Switched to header-based resolution (Spring's default): both real
        # producers (control-plane's planner and fan-in) use JsonSerializer,
        # which always stamps a __TypeId__ header, so this is reliable for
        # actual traffic. Only breaks for a hand-crafted test message with no
        # header -- publish through a real Spring producer to test instead.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      # research.subtasks has 12 partitions; 6 concurrent listener threads is
      # the PLAN Week 2 number for parallel researchers.
      concurrency: 6

retrieval:
  base-url: http://localhost:8081
  connect-timeout: 5s
  read-timeout: 30s

researcher:
  # Interim limits -- see ResearcherProperties javadoc. PLAN's numbers:
  # 90s wall clock, 25k tokens per subtask.
  wall-clock-budget: 90s
  token-budget: 25000
  max-search-queries: 5
  max-documents-to-extract: 5
  passages-per-query: 6

critic:
  # PLAN's numbers: batch 10 claims per grading call, top-3 passages by
  # cosine, 0.15 unsupported-ratio threshold.
  batch-size: 10
  top-k-passages: 3
  unsupported-ratio-threshold: 0.15

fixtures:
  # Off by default -- a normal live run costs real DeepSeek/search credits
  # as usual. Set true for one deliberate run to capture fixture data (see
  # HttpRetrievalClient/RecordingChatModelConfig); the "fixture" Spring
  # profile is the separate switch that replays what was captured, never
  # calling out at all.
  record-mode: false

server:
  port: 8082
