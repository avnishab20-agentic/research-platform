spring.application.name=control-plane
# Credentials come from the repo-root .env (gitignored). Both paths are listed because
# the working directory is the repo root from some launchers and the module from others.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
server.port=8083
