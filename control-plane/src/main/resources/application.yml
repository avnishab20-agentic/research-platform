spring:
  application:
    name: control-plane
  security:
    oauth2:
      client:
        registration:
          # Spring already knows Google's and GitHub's URLs; only our app's credentials go here.
          # "unset" lets the app start without them -- the provider just rejects the login.
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:unset}
            client-secret: ${GITHUB_CLIENT_SECRET:unset}
            scope: read:user
  datasource:
    url: jdbc:postgresql://localhost:5432/research
    username: research
    # Read from the environment so no real password lives in this file. The
    # "research" after the colon is only the fallback for the local
    # docker-compose Postgres (same value as docker-compose.yml).
    password: ${SPRING_DATASOURCE_PASSWORD:research}
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    model:
      chat: openai
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: control-plane
      auto-offset-reset: earliest
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 600000
        spring.json.trusted.packages: com.comeback.researchplatform.common
        # research.findings only ever carries ResearchFinding -- same
        # reasoning as agent-service's subtask consumer (see its
        # application.yml comment / docs/progress 2026-09-22 entry for the
        # bug this avoids: without an explicit value-deserializer AND this
        # default type, messages arrive as raw Strings and the listener
        # can't convert them).
        spring.json.value.default.type: com.comeback.researchplatform.common.ResearchFinding
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: 6

planner:
  # 5 researchers per run: fewer, better-sourced answers beat 8 thin ones,
  # and it caps a run at ~25 Tavily credits (5 queries each).
  min-fan-out: 5
  max-fan-out: 5
  max-runs-per-day: 20
  level-deadline: 3m

server:
  port: 8083
  # Behind Caddy, trust its X-Forwarded-* headers: the OAuth2 redirect_uri is then built as
  # https://<public host>/..., and getRemoteAddr() returns the user's IP instead of Caddy's.
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  user-ttl: 24h
  guest-ttl: 7d
  # Where the browser lands after a Google/GitHub login, with the token in the URL fragment.
  login-redirect: ${LOGIN_REDIRECT:http://localhost:8081/}