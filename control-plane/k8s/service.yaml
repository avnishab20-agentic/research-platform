apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: control-plane
spec:
  # The one service meant to be reached from a browser. No auth yet (JWT is still to do).
