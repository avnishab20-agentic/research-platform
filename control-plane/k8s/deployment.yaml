apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: researchplatformacr.azurecr.io/control-plane:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "0.25"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 5
            failureThreshold: 24
