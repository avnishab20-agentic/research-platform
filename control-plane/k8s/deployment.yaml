apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: namespace-workflow-1790106905740
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: researchplatformacr.azurecr.io/control-plane:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            # On Java 21 a Kafka client blocking under a lock pins its virtual thread's carrier,
            # and a 1-CPU pod has one carrier, so one stuck Kafka call froze HTTP requests too.
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "false"
            # Trust X-Forwarded-Proto from the in-cluster front door, so an https page's POST
            # is seen as same-origin instead of an http/https mismatch (CORS 403).
            - name: SERVER_FORWARDHEADERSSTRATEGY
              value: native
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "0.25"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 5
            failureThreshold: 24
